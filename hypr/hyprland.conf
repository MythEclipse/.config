# =============================================================================
# HYPRLAND CONFIGURATION (FIXED & SUPERCHARGED)
# =============================================================================

# Core Ecosystem Utilities
# exec-once = hyprpaper (migrated to swww)
exec-once = hypridle

# --- 2. CLIPBOARD MANAGER (Moved to AUTOSTART section) ---

# --- UI COMPONENTS ---
monitor = eDP-1, 1920x1200@165, 0x0, 1, vrr, 2
monitor = , preferred, auto, 1

# --- PROGRAMS ---
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$browser = brave --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding

# --- ENVIRONMENT VARIABLES ---
# XDG & QT
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_PASSWORD_STORE,gnome-keyring
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QUICK_CONTROLS_STYLE,org.kde.desktop
env = XDG_CURRENT_DESKTOP,Hyprland
# Cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# NVIDIA & Wayland Integration
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,egl
env = GBM_BACKEND,nvidia-drm
env = WLR_DRM_NO_ATOMIC,1

# Electron & Mozilla
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# --force-dark-mode: ikuti color-scheme OS di Chromium/Electron WebView
env = QTWEBENGINE_CHROMIUM_FLAGS,--ignore-gpu-blocklist --enable-gpu-rasterization --ozone-platform-hint=auto --force-color-profile=srgb
# GTK4/libadwaita: paksa baca portal untuk color-scheme
env = GDK_DEBUG,portals

# Toolkit Backends
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# --- GPU SPECIFIC (Auto-generated by install.sh) ---
#source = ~/.config/hypr/conf/gpu.conf

# SSH Auth Socket
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh


# --- 2. WINDOWS & WORKSPACES ---
# Force rendering of unfocused windows (keeps background processes active/unfrozen)
windowrule = match:class .*, render_unfocused 1

# Workspace Assignments
windowrule = match:class ^(kitty)$, workspace 1
windowrule = match:class ^(com.rtosta.zapzap)$, workspace 2
windowrule = match:class ^(zapzap)$, workspace 2
windowrule = match:class ^(discord)$, workspace 3
windowrule = match:class ^(Discord)$, workspace 3
windowrule = match:class ^(Brave-browser)$, workspace 4
windowrule = match:class ^(brave-browser)$, workspace 4

# Float Rules (windowrule v0.53.0+)
windowrule = match:class ^(pavucontrol)$, float 1
windowrule = match:class ^(thunar)$, float 1
windowrule = match:class ^(nm-connection-editor)$, float 1
windowrule = match:class ^(blueman-manager)$, float 1
windowrule = match:class ^(RimSort)$, float 1
windowrule = match:class ^(RimSort)$, size 1100 750
windowrule = match:class ^(RimSort)$, center 1
windowrule = match:class ^(thunar)$, size 900 600

# Android Emulator
windowrule = match:title ^(Android Emulator)$, float 1
windowrule = match:class ^(Emulator)$, float 1

# --- AUTOSTART ---

# System Utils
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hypridle &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = swaync &
exec-once = pyprland &

# Tray Apps
exec-once = nm-applet &
exec-once = blueman-applet &

# Wallpaper & Clipboard
# Wallpaper (awww migration)
exec-once = awww-daemon
exec-once = sleep 1 && awww img ~/.config/hypr/wallpapers/1339403.jpeg --transition-type wipe --transition-angle 30 --transition-step 90
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# User Apps
exec-once = kitty
exec-once = waybar
exec-once = warp-taskbar
exec-once = brave --password-store=gnome --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding
exec-once = zapzap --wayland
exec-once = discord


# --- INPUT ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.4
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        clickfinger_behavior = true
        scroll_factor = 0.5
    }
}

# --- GENERAL ---
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    layout = dwindle
    allow_tearing = false

    # Catppuccin Mocha — animated gradient border
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) rgba(a6e3a1ff) 60deg
    col.inactive_border = rgba(313244aa)

    # Group bar theming
    col.nogroup_border = rgba(45475aaa)
    col.nogroup_border_active = rgba(fab387ff)
}

# --- DECORATION ---
decoration {
    rounding = 12
    active_opacity = 0.95
    inactive_opacity = 0.82
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.08
    dim_special = 0.4

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.015
        contrast = 1.1
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.0
        ignore_opacity = true
        popups = true
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(1e1e2ecc)
        color_inactive = rgba(1e1e2e66)
        offset = 0 4
        scale = 0.98
    }
}

# --- ANIMATIONS ---
animations {
    enabled = yes

    # Bezier curves
    bezier = easeOut,    0.16, 1,    0.3,  1
    bezier = easeIn,     0.7,  0,    0.84, 0
    bezier = spring,     0.5,  1.5,  0.5,  1
    bezier = linear,     0,    0,    1,    1
    bezier = snapOut,    0.04, 0.9,  0.1,  1.05

    # Windows
    animation = windowsIn,    1, 4, snapOut,  slide
    animation = windowsOut,   1, 3, easeIn,   slide
    animation = windowsMove,  1, 4, easeOut

    # Borders
    animation = border,       1, 6,  linear
    animation = borderangle,  1, 60, linear,  loop

    # Fade
    animation = fadeIn,       1, 3,  easeOut
    animation = fadeOut,      1, 3,  easeIn
    animation = fadeSwitch,   1, 4,  easeOut
    animation = fadeDim,      1, 4,  easeOut
    animation = fadeLayers,   1, 3,  easeOut

    # Workspaces
    animation = workspaces,   1, 5,  snapOut, slidefade 15%
    animation = specialWorkspace, 1, 4, snapOut, slidefadevert 20%
}

# --- LAYOUTS ---
dwindle {
    preserve_split = true
    smart_split = true
    smart_resizing = true
}

master {
    new_status = master
    mfact = 0.55
}

group {
    col.border_active = rgba(cba6f7ff)
    col.border_inactive = rgba(45475aaa)
    col.border_locked_active = rgba(fab387ff)
    col.border_locked_inactive = rgba(313244aa)

    groupbar {
        enabled = true
        font_family = JetBrainsMono Nerd Font
        font_size = 10
        height = 22
        col.active = rgba(cba6f7cc)
        col.inactive = rgba(31324488)
        col.locked_active = rgba(fab387cc)
        col.locked_inactive = rgba(45475a88)
        gradients = true
        render_titles = true
        scrolling = true
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty|Alacritty)$
    render_unfocused_fps = 60
}

# =============================================================================
# SUPERCHARGED KEYBINDS
# =============================================================================

# --- 1. APLIKASI & SYSTEM ---
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, F5, exec, hyprctl reload
bind = $mainMod, M, exit                  # Keluar dari Hyprland
bind = $mainMod, C, killactive            # Tutup window aktif
bind = $mainMod, L, exec, hyprlock        # Lock screen

# --- 2. CLIPBOARD MANAGER (Requires: cliphist & wofi) ---
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, V, exec, cliphist wipe && notify-send "Clipboard" "History cleared"

# --- 3. WINDOW MANAGEMENT ---
bind = $mainMod, F, fullscreen, 1         # Maximize (tetap tampilkan bar/gaps)
bind = $mainMod SHIFT, F, fullscreen, 0   # Fullscreen total (game mode)
bind = $mainMod SHIFT, Space, togglefloating    # Ubah jadi melayang (Floating)
# bind = $mainMod, P, pseudo                # Dwindle effect (Conflict with predator-mode)
bind = $mainMod, J, layoutmsg, togglesplit           # Ubah split (vertikal/horizontal)
bind = $mainMod, Y, pin                   # Pin window (selalu muncul)

# --- 4. GROUPS (TABBED MODE - Seperti Browser) ---
bind = $mainMod, G, togglegroup           # Buat/Hancurkan Group (Tab)
# bind = $mainMod, Tab, changegroupactive, f  # Pindah ke Tab Berikutnya (Conflict with pypr expose)
bind = $mainMod SHIFT, Tab, changegroupactive, b # Pindah ke Tab Sebelumnya
bind = $mainMod CTRL, G, lockactivegroup, toggle  # Kunci grup

# --- 5. FOKUS & PINDAH WINDOW (Arrow Keys & VIM Keys) ---
# Pindah Fokus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Geser Posisi Window (Swap)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- 6. RESIZE WINDOW (Tahan Super+Ctrl+Panah) ---
binde = $mainMod CTRL, right, resizeactive, 20 0
binde = $mainMod CTRL, left, resizeactive, -20 0
binde = $mainMod CTRL, up, resizeactive, 0 -20
binde = $mainMod CTRL, down, resizeactive, 0 20

# --- 7. SPECIAL WORKSPACE (SCRATCHPAD) ---
bind = $mainMod, S, togglespecialworkspace, magic   # Buka/Tutup laci rahasia
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # Lempar window ke laci rahasia

# --- 8. WORKSPACES (Standar) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Pindah Window ke Workspace lain (tetap di workspace sekarang)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Pindah Window + Ikut Pindah (Optional, pakai CTRL)
bind = $mainMod CTRL, 1, movetoworkspace, 1

# Scroll Mouse untuk pindah workspace
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- 9. MOUSE ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- 10. SCREENSHOT & MEDIA ---
# Screenshot (Partial / Select + Copy to Clipboard)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Area copied to clipboard" -i camera-photo
# Screenshot (Partial / Select + Edit / Swappy)
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | swappy -f -
# Screenshot (Full Screen & Save)
bind = CTRL, Print, exec, grim ~/Pictures/Screenshots/Screenshot-$(date +'%Y-%m-%d-%H%M%S').png && notify-send "Screenshot" "Full screen saved to Pictures" -i camera-photo

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Media Control
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Color Picker
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# SwayNC (Notifications & Control Center)
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod ALT, T, exec, ~/.local/bin/dark-light-toggle # Toggle Dark/Light Mode

# Acer Predator (Performance Mode Toggle)
bind = $mainMod, P, exec, ~/.local/bin/predator-mode
bind = , XF86Launch1, exec, ~/.local/bin/predator-mode

# Hyprsunset (Night Mode Toggle)
bind = $mainMod SHIFT, N, exec, pkill hyprsunset || hyprsunset -t 4500

# Pyprland (Scratchpads & Overview)
bind = $mainMod, T, exec, pypr toggle term
bind = $mainMod ALT, V, exec, pypr toggle volume
bind = $mainMod, Tab, exec, pypr expose

# System Monitor
bind = $mainMod ALT, M, exec, pypr toggle btop

# Pyprland magnify (zoom in/out)
bind = $mainMod, Z, exec, pypr zoom ++0.5
bind = $mainMod SHIFT, Z, exec, pypr zoom

# --- THEME LOADING ---
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Tokyonight-Dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = gsettings set org.gnome.desktop.interface font-name 'JetBrains Mono Nerd Font 10'

exec-once = hyprctl setcursor Bibata-Modern-Ice 24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# --- WINDOW RULES (additional) ---
windowrule = match:class ^(btop)$, float 1
windowrule = match:class ^(btop)$, size 1200 700
windowrule = match:class ^(btop)$, center 1
windowrule = match:class ^(pypr-term)$, float 1
windowrule = match:title ^(.*)(nvim|vim)(.*)(COMMIT_EDITMSG)$, float 1
windowrule = match:class ^(xdg-desktop-portal)$, float 1
windowrule = match:class ^(xdg-desktop-portal-gnome)$, float 1
windowrule = opacity 0.95 override, match:class ^(kitty)$
windowrule = opacity 0.96 override, match:class ^(Brave-browser)$

# --- LAYERRULES ---
layerrule = blur waybar
layerrule = blur swaync
layerrule = blur wofi
layerrule = blur wlogout
