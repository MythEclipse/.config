general {
    no_fade_in = false
    no_fade_out = false
    grace = 2
    disable_loading = false
    immediate_render = true
    ignore_empty_input = false
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/hoyoverse.jpg
    color = rgba(17, 17, 27, 1.0)

    blur_passes = 4
    blur_size = 6
    noise = 0.008
    contrast = 0.85
    brightness = 0.75
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ── Clock ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(205, 214, 244, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 3
    shadow_color = rgba(0, 0, 0, 0.4)
    shadow_size = 8
}

# ── Date ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "<i>$(date +'%A, %d %B %Y')</i>"
    color = rgba(203, 166, 247, 0.80)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# ── Greeting ─────────────────────────────────────────────────
label {
    monitor =
    text =   $USER @ Predator
    color = rgba(137, 180, 250, 0.70)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

# ── Password Input ────────────────────────────────────────────
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(203, 166, 247, 0.55)
    inner_color = rgba(17, 17, 27, 0.65)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##a6adc8" font_size="small">🔑  Enter password</span>
    hide_input = false
    rounding = 14
    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_timeout = 2000
    fail_transition = 300
    position = 0, -10
    halign = center
    valign = center
}
