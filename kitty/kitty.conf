# Predator Glass Kitty Theme (Catppuccin Mocha)

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.5
font_features JetBrainsMonoNF-Regular +liga +calt +kern

window_padding_width 12
background_opacity 0.88
background_blur 20
cursor_shape beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 10.0
cursor_beam_thickness 1.8

# Window
remember_window_size  no
initial_window_width  920
initial_window_height 560
window_border_width   1pt
draw_minimal_borders  no
resize_in_steps       no

# Scrollback
scrollback_lines       10000
scrollback_pager_history_size 0

# Links
mouse_map left click ungrabbed mouse_handle_click selection link prompt
detect_urls yes
url_prefixes https http file ftp
open_url_with default
copy_on_select no

# Colors - Catppuccin Mocha
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #CBA6F7

# Cursor
cursor                  #CBA6F7
cursor_text_color       #1E1E2E

# URL
url_color               #F5E0DC
url_style               curly

# Borders
active_border_color     #CBA6F7
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# Tabs — powerline slanted with Predator accent
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        1
tab_bar_margin_width    0
tab_bar_margin_color    #11111B
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
active_tab_font_style   bold
inactive_tab_foreground #6C7086
inactive_tab_background #181825
inactive_tab_font_style normal
tab_bar_background      #11111B
tab_title_template      "{fmt.fg._CBA6F7}{index}{fmt.fg.tab}:{title[:20]}"

# Color Palette
# Black
color0 #45475A
color8 #585B70
# Red
color1 #F38BA8
color9 #F38BA8
# Green
color2 #A6E3A1
color10 #A6E3A1
# Yellow
color3 #F9E2AF
color11 #F9E2AF
# Blue
color4 #89B4FA
color12 #89B4FA
# Magenta
color5 #F5C2E7
color13 #F5C2E7
# Cyan
color6 #94E2D5
color14 #94E2D5
# White
color7 #BAC2DE
color15 #A6ADC8

confirm_os_window_close 0
enable_audio_bell no

# === FORCE TAB BAR (FINAL OVERRIDE) ===
tab_bar_style powerline
tab_bar_min_tabs 1